name: Publish Gerber2PNG Local release

on:
  push:
    tags:
      - v1.1.3

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "Gerber2PNG Local for KiCad ${GITHUB_REF_NAME#v}" \
              --notes "Windows installer for the modified KiCad plugin and local Gerber2PNG service. The installer includes a standalone Python runtime. Extract the ZIP and run Install-Gerber2PNG-Local.cmd as administrator, then select the KiCad plugins folder and restart KiCad."
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            "Gerber2PNG-Local/release/Gerber2PNG-Local-v1.1.3-Windows.zip" \
            --clobber
