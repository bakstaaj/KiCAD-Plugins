name: Publish Gerber2PNG Local release

on:
  push:
    tags:
      - v1.0.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "Gerber2PNG-Local/release/Gerber2PNG-Local-v1.0.0-Windows.zip" \
            --clobber
